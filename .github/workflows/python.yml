name: Python

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/python/**"
      - ".github/workflows/python.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/python/**"
      - ".github/workflows/python.yml"

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: "python (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [vanilla, fastapi, flask, django]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: languages/python/${{ matrix.framework }}/uv.lock

      - name: Install dependencies
        working-directory: languages/python/${{ matrix.framework }}
        run: uv sync --locked --dev

      - name: Lint (ruff)
        working-directory: languages/python/${{ matrix.framework }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        working-directory: languages/python/${{ matrix.framework }}
        run: |
          if [ "${{ matrix.framework }}" = "django" ]; then
            uv run python manage.py test
          else
            uv run pytest -q
          fi

      - name: Docker build
        if: matrix.framework != 'vanilla'
        working-directory: languages/python/${{ matrix.framework }}
        run: docker build -t python-${{ matrix.framework }} .
