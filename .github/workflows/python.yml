name: Python

on:
  push:
    branches: [main]
    paths:
      - "languages/python/**"
      - ".github/workflows/python.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/python/**"
      - ".github/workflows/python.yml"

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: "python (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [vanilla, fastapi, flask, django]
        include:
          - { framework: python-version, value: "3.12" }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            languages/python/${{ matrix.framework }}/requirements*.txt
            languages/python/${{ matrix.framework }}/pyproject.toml

      - name: Install dependencies
        working-directory: languages/python/${{ matrix.framework }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements*.txt 2>/dev/null || true
          pip install -e . 2>/dev/null || true

      - name: Lint (ruff)
        if: matrix.framework != 'vanilla'
        working-directory: languages/python/${{ matrix.framework }}
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: languages/python/${{ matrix.framework }}
        run: |
          if [ -d tests ] || [ -d test ]; then
            python -m pytest -q
          fi

      - name: Docker build
        if: matrix.framework != 'vanilla'
        working-directory: languages/python/${{ matrix.framework }}
        run: |
          if [ -f Dockerfile ]; then docker build -t python-${{ matrix.framework }} .; fi
