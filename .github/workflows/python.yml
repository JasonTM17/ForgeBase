name: Python

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/python/**"
      - ".github/workflows/python.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/python/**"
      - ".github/workflows/python.yml"

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: "python (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [vanilla, fastapi, flask, django]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: languages/python/${{ matrix.framework }}/uv.lock

      - name: Install dependencies
        working-directory: languages/python/${{ matrix.framework }}
        run: uv sync --locked --dev

      - name: Lint (ruff)
        working-directory: languages/python/${{ matrix.framework }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        working-directory: languages/python/${{ matrix.framework }}
        run: |
          if [ "${{ matrix.framework }}" = "django" ]; then
            uv run python manage.py test
          else
            uv run pytest -q
          fi

      - name: Docker build
        if: matrix.framework != 'vanilla'
        working-directory: languages/python/${{ matrix.framework }}
        run: docker build -t python-${{ matrix.framework }} .
