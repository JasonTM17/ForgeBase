name: Python

on:
  push:
    branches: [main]
    paths:
      - "languages/python/**"
      - ".github/workflows/python.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/python/**"
      - ".github/workflows/python.yml"

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: "python (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [vanilla, fastapi, flask, django]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: languages/python/${{ matrix.framework }}/uv.lock

      - name: Install dependencies
        working-directory: languages/python/${{ matrix.framework }}
        run: uv sync --locked --dev

      - name: Lint (ruff)
        working-directory: languages/python/${{ matrix.framework }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        working-directory: languages/python/${{ matrix.framework }}
        run: |
          if [ "${{ matrix.framework }}" = "django" ]; then
            uv run python manage.py test
          else
            uv run pytest -q
          fi

      - name: Docker build
        if: matrix.framework != 'vanilla'
        working-directory: languages/python/${{ matrix.framework }}
        run: docker build -t python-${{ matrix.framework }} .
