name: Kotlin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/kotlin/**"
      - ".github/workflows/kotlin.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/kotlin/**"
      - ".github/workflows/kotlin.yml"

concurrency:
  group: kotlin-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  kotlin:
    name: "kotlin (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [vanilla, ktor]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Test
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/workspace"
          -w "/workspace/languages/kotlin/${{ matrix.framework }}"
          gradle:8.14-jdk21 gradle test --no-daemon

      - name: Docker build
        if: matrix.framework != 'vanilla'
        working-directory: languages/kotlin/${{ matrix.framework }}
        run: docker build -t kotlin-${{ matrix.framework }} .
