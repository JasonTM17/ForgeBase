name: Kotlin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/kotlin/**"
      - ".github/workflows/kotlin.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/kotlin/**"
      - ".github/workflows/kotlin.yml"

concurrency:
  group: kotlin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kotlin:
    name: "kotlin (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [vanilla, ktor]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Test
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/workspace"
          -w "/workspace/languages/kotlin/${{ matrix.framework }}"
          gradle:8.14-jdk21 gradle test --no-daemon

      - name: Docker build
        if: matrix.framework != 'vanilla'
        working-directory: languages/kotlin/${{ matrix.framework }}
        run: docker build -t kotlin-${{ matrix.framework }} .
