name: Rust

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/rust/**"
      - ".github/workflows/rust.yml"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: "rust (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [vanilla, axum, actix-web]

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: languages/rust/${{ matrix.framework }}

      - name: Format check
        working-directory: languages/rust/${{ matrix.framework }}
        run: cargo fmt --check

      - name: Clippy
        working-directory: languages/rust/${{ matrix.framework }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: languages/rust/${{ matrix.framework }}
        run: cargo test

      - name: Docker build
        if: matrix.framework != 'vanilla'
        working-directory: languages/rust/${{ matrix.framework }}
        run: |
          test -f Dockerfile || { echo "::error::Dockerfile missing for rust/${{ matrix.framework }}"; exit 1; }
          docker build -t rust-${{ matrix.framework }} .
