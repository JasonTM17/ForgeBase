name: Rust

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/rust/**"
      - ".github/workflows/rust.yml"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: "rust (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [vanilla, axum, actix-web]

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: languages/rust/${{ matrix.framework }}

      - name: Format check
        working-directory: languages/rust/${{ matrix.framework }}
        run: cargo fmt --check

      - name: Clippy
        working-directory: languages/rust/${{ matrix.framework }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: languages/rust/${{ matrix.framework }}
        run: cargo test

      - name: Docker build
        if: matrix.framework != 'vanilla'
        working-directory: languages/rust/${{ matrix.framework }}
        run: |
          if [ -f Dockerfile ]; then docker build -t rust-${{ matrix.framework }} .; fi
