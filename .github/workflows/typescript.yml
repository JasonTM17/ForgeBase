name: TypeScript

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/typescript/**"
      - ".github/workflows/typescript.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/typescript/**"
      - ".github/workflows/typescript.yml"

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: "typescript (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: languages/typescript/${{ matrix.framework }}
    strategy:
      fail-fast: false
      matrix:
        framework:
          - node
          - express
          - nestjs
          - fastify
          - react
          - nextjs
          - vue
          - nuxt
          - angular
          - svelte
          - sveltekit
          - react-native
        node-version: ["22"]

    steps:
      - uses: actions/checkout@v4

      - name: Prepare example environment
        run: |
          if [ -f .env.example ]; then cp .env.example .env; fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: languages/typescript/${{ matrix.framework }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Docker build
        if: matrix.framework != 'react-native' && matrix.framework != 'node'
        run: docker build -t ts-${{ matrix.framework }} .
