name: TypeScript

on:
  push:
    branches: [main]
    paths:
      - "languages/typescript/**"
      - ".github/workflows/typescript.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/typescript/**"
      - ".github/workflows/typescript.yml"

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: languages/typescript/${{ matrix.framework }}

jobs:
  typescript:
    name: "typescript (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework:
          - node
          - express
          - nestjs
          - fastify
          - hono
          - react
          - nextjs
          - vue
          - nuxt
          - angular
          - svelte
          - sveltekit
          - react-native
        node-version: ["22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: languages/typescript/${{ matrix.framework }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Format check
        run: npm run format:check --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      - name: Docker build
        if: matrix.framework != 'react-native'
        run: |
          if [ -f Dockerfile ]; then docker build -t ts-${{ matrix.framework }} .; fi
