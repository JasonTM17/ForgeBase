name: Go

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/go/**"
      - ".github/workflows/go.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/go/**"
      - ".github/workflows/go.yml"

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: "go (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [vanilla, gin, net-http, fiber]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: languages/go/**/go.sum

      - name: Vet
        working-directory: languages/go/${{ matrix.framework }}
        run: go vet ./...

      - name: Test
        working-directory: languages/go/${{ matrix.framework }}
        run: go test ./...

      - name: Docker build
        if: matrix.framework != 'vanilla'
        working-directory: languages/go/${{ matrix.framework }}
        run: |
          if [ -f Dockerfile ]; then docker build -t go-${{ matrix.framework }} .; fi
