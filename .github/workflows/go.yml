name: Go

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/go/**"
      - ".github/workflows/go.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/go/**"
      - ".github/workflows/go.yml"

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: "go (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [vanilla, gin, net-http, fiber]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: languages/go/**/go.sum

      - name: Vet
        working-directory: languages/go/${{ matrix.framework }}
        run: go vet ./...

      - name: Test
        working-directory: languages/go/${{ matrix.framework }}
        run: go test ./...

      - name: Docker build
        if: matrix.framework != 'vanilla'
        working-directory: languages/go/${{ matrix.framework }}
        run: |
          test -f Dockerfile || { echo "::error::Dockerfile missing for go/${{ matrix.framework }}"; exit 1; }
          docker build -t go-${{ matrix.framework }} .
