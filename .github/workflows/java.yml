name: Java

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/java/**"
      - ".github/workflows/java.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/java/**"
      - ".github/workflows/java.yml"

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  java:
    name: "java (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [vanilla, spring-boot, quarkus]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test (Maven)
        working-directory: languages/java/${{ matrix.framework }}
        run: mvn -B verify

      - name: Docker build
        if: matrix.framework != 'vanilla'
        working-directory: languages/java/${{ matrix.framework }}
        run: |
          test -f Dockerfile || { echo "::error::Dockerfile missing for java/${{ matrix.framework }}"; exit 1; }
          docker build -t java-${{ matrix.framework }} .
