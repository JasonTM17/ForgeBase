name: C#

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/csharp/**"
      - ".github/workflows/csharp.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/csharp/**"
      - ".github/workflows/csharp.yml"

concurrency:
  group: csharp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  csharp:
    name: "csharp (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [vanilla, aspnetcore]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build
        working-directory: languages/csharp/${{ matrix.framework }}
        run: dotnet build

      - name: Format check
        working-directory: languages/csharp/${{ matrix.framework }}
        run: dotnet format --verify-no-changes

      - name: Test
        working-directory: languages/csharp/${{ matrix.framework }}
        run: dotnet test --no-build

      - name: Docker build
        if: matrix.framework != 'vanilla'
        working-directory: languages/csharp/${{ matrix.framework }}
        run: |
          test -f Dockerfile || { echo "::error::Dockerfile missing for csharp/${{ matrix.framework }}"; exit 1; }
          docker build -t csharp-${{ matrix.framework }} .
