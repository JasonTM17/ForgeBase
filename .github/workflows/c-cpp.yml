name: C and C++

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/c/**"
      - "languages/cpp/**"
      - ".github/workflows/c-cpp.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/c/**"
      - "languages/cpp/**"
      - ".github/workflows/c-cpp.yml"

concurrency:
  group: c-cpp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  c-cpp:
    name: "c/cpp (${{ matrix.language }}/${{ matrix.framework }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [c, cpp]
        framework: [vanilla]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure, build, test
        working-directory: languages/${{ matrix.language }}/${{ matrix.framework }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
