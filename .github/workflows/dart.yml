name: Dart

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/dart/**"
      - ".github/workflows/dart.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/dart/**"
      - ".github/workflows/dart.yml"

concurrency:
  group: dart-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dart-vanilla:
    name: "dart/vanilla"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Install dependencies
        working-directory: languages/dart/vanilla
        run: dart pub get

      - name: Analyze
        working-directory: languages/dart/vanilla
        run: dart analyze

      - name: Format check
        working-directory: languages/dart/vanilla
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        working-directory: languages/dart/vanilla
        run: dart test

  flutter:
    name: "dart/flutter (analyze + format; device tests CI-first)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: languages/dart/flutter
        run: flutter pub get

      - name: Analyze
        working-directory: languages/dart/flutter
        run: flutter analyze

      - name: Format check
        working-directory: languages/dart/flutter
        run: dart format --output=none --set-exit-if-changed .

      - name: Widget tests
        working-directory: languages/dart/flutter
        run: flutter test
