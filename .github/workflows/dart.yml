name: Dart

on:
  push:
    branches: [main]
    paths:
      - "languages/dart/**"
      - ".github/workflows/dart.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/dart/**"
      - ".github/workflows/dart.yml"

concurrency:
  group: dart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-vanilla:
    name: "dart/vanilla"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        working-directory: languages/dart/vanilla
        run: dart pub get

      - name: Analyze
        working-directory: languages/dart/vanilla
        run: dart analyze

      - name: Format check
        working-directory: languages/dart/vanilla
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        working-directory: languages/dart/vanilla
        run: dart test

  flutter:
    name: "dart/flutter (analyze + format; device tests CI-first)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: languages/dart/flutter
        run: flutter pub get

      - name: Analyze
        working-directory: languages/dart/flutter
        run: flutter analyze

      - name: Format check
        working-directory: languages/dart/flutter
        run: dart format --output=none --set-exit-if-changed .

      - name: Widget tests
        working-directory: languages/dart/flutter
        run: flutter test
