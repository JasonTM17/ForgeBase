name: PHP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/php/**"
      - ".github/workflows/php.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/php/**"
      - ".github/workflows/php.yml"

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: "php (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: vanilla
            php-version: "8.3"
          - framework: laravel
            php-version: "8.4"

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Validate composer metadata
        working-directory: languages/php/${{ matrix.framework }}
        run: composer validate --strict

      - name: Install dependencies
        working-directory: languages/php/${{ matrix.framework }}
        run: |
          if [ -f composer.json ]; then composer install --no-interaction --prefer-dist; fi

      - name: Test
        working-directory: languages/php/${{ matrix.framework }}
        run: composer test
