name: Ruby

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "languages/ruby/**"
      - ".github/workflows/ruby.yml"
  pull_request:
    branches: [main]
    paths:
      - "languages/ruby/**"
      - ".github/workflows/ruby.yml"

concurrency:
  group: ruby-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ruby:
    name: "ruby (${{ matrix.framework }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [vanilla, rails]
        ruby-version: ["3.3"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: ${{ matrix.framework == 'rails' }}
          working-directory: ${{ matrix.framework == 'rails' && 'languages/ruby/rails' || '.' }}

      - name: "Vanilla: run tests"
        if: matrix.framework == 'vanilla'
        working-directory: languages/ruby/vanilla
        run: ruby test/run_test.rb

      - name: "Rails: install, prepare, test"
        if: matrix.framework == 'rails'
        working-directory: languages/ruby/rails
        env:
          RAILS_ENV: test
          SERVICE_NAME: ci
        run: |
          bundle exec rails db:prepare
          bundle exec rails test

      - name: Docker build
        if: matrix.framework == 'rails'
        working-directory: languages/ruby/rails
        run: |
          test -f Dockerfile || { echo "::error::Dockerfile missing for ruby/rails"; exit 1; }
          docker build -t ruby-rails .
