forgebase.app.name=${APP_NAME:forgebase-quarkus}
forgebase.app.env=${APP_ENV:development}

quarkus.http.port=${APP_PORT:8000}
quarkus.package.jar.type=fast-jar
quarkus.log.level=INFO
quarkus.log.console.format="%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n"
quarkus.smallrye-health.root-path=/q/health

