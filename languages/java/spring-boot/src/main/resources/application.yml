spring:
  application:
    name: ${APP_NAME:forgebase-spring}
  config:
    import: "optional:file:.env[.properties]"

server:
  port: ${APP_PORT:8000}
  # Graceful shutdown: wait for in-flight requests to finish.
  shutdown: graceful

# Structured, leveled logging with timestamps and context.
logging:
  level:
    root: INFO
    com.forgebase.springboot: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator probes for liveness/readiness.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  env: ${APP_ENV:development}
