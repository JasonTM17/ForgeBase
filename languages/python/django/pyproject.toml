[project]
name = "forgebase-django"
version = "1.0.0"
description = "ForgeBase Django starter: API-only base with env-driven settings, JSON logging, error envelope middleware, health endpoints, and gunicorn."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "django>=5.2",
    "gunicorn>=22.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "common", "examples"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
