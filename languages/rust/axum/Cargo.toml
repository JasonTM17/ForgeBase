[package]
name = "axum-starter"
version = "0.1.0"
edition = "2021"
description = "ForgeBase Axum + Tokio API starter"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lib]
name = "axum_starter"
path = "src/lib.rs"

[[bin]]
name = "axum-starter"
path = "src/main.rs"
