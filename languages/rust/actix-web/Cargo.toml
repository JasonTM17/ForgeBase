[package]
name = "actix-starter"
version = "0.1.0"
edition = "2021"
description = "ForgeBase Actix Web API starter"
license = "MIT"

[dependencies]
actix-web = "4"
env_logger = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "actix_starter"
path = "src/lib.rs"

[[bin]]
name = "actix-starter"
path = "src/main.rs"
